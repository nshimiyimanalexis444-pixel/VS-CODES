<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact the Project Hub team for support, questions, or project-related inquiries.">
    <title>Contact | Project Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <div class="logo-section">
            <img class="project-image" src="image1.png" alt="Project Hub logo">
            <h2>Project Hub</h2>
        </div>

        <nav class="main-nav" aria-label="Main navigation">
            <ul class="list-nav">
                <li><a class="link-nav" href="index.html">HOME</a></li>
                <li><a class="link-nav" href="about.html">ABOUT</a></li>
                <li><a class="link-nav" href="project.html">PROJECT</a></li>
                <li><a class="link-nav" href="register.html">REGISTER</a></li>
                <li><a class="link-nav" href="student-dashboard.html">STUDENT DASHBOARD</a></li>
                <li><a class="link-nav" href="supervisor-dashboard.html">SUPERVISOR DASHBOARD</a></li>
                <li><a class="link-nav" href="contact.html">CONTACT</a></li>
                <li><a class="link-nav" href="login.html">LOGIN</a></li>
            </ul>
        </nav>
    </header>

    <main class="page-shell">
        <header class="page-header">
            <h1>Contact Us</h1>
        </header>

        <section class="two-column">
            <article class="content-block">
                <h3>Get in touch</h3>
                <p>Email: alexis@projecthub.edu</p>
                <p>Phone: +250798217814</p>
                <p>Location: Student Affairs Office, Main Campus</p>
            </article>

            <aside class="form-card">
                <form class="form-grid" novalidate>
                    <div>
                        <label for="name">Your Name</label>
                        <input type="text" id="name" name="name" placeholder="Enter your name" maxlength="50">
                    </div>
                    <div>
                        <label for="message">Message</label>
                        <textarea id="message" name="message" placeholder="Write your message here..." maxlength="250"></textarea>
                    </div>
                    <button class="action-btn" type="submit">Send Message</button>
                </form>
            </aside>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
